name: Build Bluefin LTS KDE

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *" # daily rebuild to pick up security updates
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: bluefin-lts-kde
      rechunk: ${{ github.event_name != 'pull_request' }}
      publish: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref == 'refs/heads/main' }}
      hwe: true
