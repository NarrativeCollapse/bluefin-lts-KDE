# CentOS Stream 10 ships no Xorg server, so the SDDM greeter must run on
# Wayland under KWin (same settings as Fedora's sddm-wayland-plasma).
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=breeze
